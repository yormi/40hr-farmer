name: SPEAR Wave 2 — Day 2 (Wed 2026-05-27)

# Fires Wed 2026-05-27 at 10:00 UTC (6:00 AM EDT).
# Before running, this workflow runs the check script for Day 1; if Day 1
# tripped the kill-switch (bounce >2%, spam >0.1%, unsubs >4%), Day 2 aborts.

on:
  # Cron disabled 2026-05-26 — Wave 2 going through HubSpot instead.
  workflow_dispatch: {}

concurrency:
  group: spear-wave2-day2
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.schedule == '0 10 27 5 *') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore sent-log cache (Body A + B)
        uses: actions/cache@v4
        with:
          path: |
            .cache/spear-wave2-sent-2026-05-27-spear-wave2-day2-bodyA.log.json
            .cache/spear-wave2-sent-2026-05-27-spear-wave2-day2-bodyB.log.json
          key: spear-wave2-day2-sent-v1

      - name: Verify it is 2026-05-27 (year guard)
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "$today" != "2026-05-27" ]; then
            echo "::error::Today is $today, not 2026-05-27. Refusing to fire."
            exit 1
          fi

      - name: Check Day 1 kill-switch + email report (abort if RED)
        env:
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          POSTMARK_FROM: guillaume@orisha.io
        run: |
          out=$(python3 email/spear/scripts/spear-wave2-check.py \
            --day 1 \
            --email guillaume@orisha.io \
            --subject-prefix "SPEAR Wave 2 Day 1 check (pre-Day 2 gate)")
          echo "$out"
          if echo "$out" | grep -q "OVERALL: RED"; then
            echo "::error::Day 1 kill-switch tripped — aborting Day 2 send."
            exit 1
          fi

      - name: Rebuild audience CSVs
        env:
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: python3 email/spear/scripts/spear-wave2-build.py --days 3

      - name: Send Body A
        env:
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          POSTMARK_FROM: guillaume@orisha.io
          POSTMARK_MESSAGE_STREAM: broadcast
        run: |
          python3 email/spear/scripts/spear-wave2-send.py \
            --csv email/spear/spear-wave2-day2-bodyA.csv \
            --body A \
            --tag 2026-05-27-spear-wave2-day2-bodyA

      - name: Send Body B
        env:
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          POSTMARK_FROM: guillaume@orisha.io
          POSTMARK_MESSAGE_STREAM: broadcast
        run: |
          python3 email/spear/scripts/spear-wave2-send.py \
            --csv email/spear/spear-wave2-day2-bodyB.csv \
            --body B \
            --tag 2026-05-27-spear-wave2-day2-bodyB
