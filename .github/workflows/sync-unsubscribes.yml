name: Sync ESP unsubscribes → HubSpot

# Scaffold only as of 2026-05-22 — ESP not yet chosen (Loops, Sequenzy, and
# Resend all dropped; evaluating Postmark). Once an ESP is locked, wire
# `fetch_esp_unsubscribes()` in the script and add the matching repo secret.
#
# Purpose: mirror ESP-side unsubscribes into HubSpot via the v1 subscriptions
# endpoint (global opt-out). Closes the CASL gap where a recipient unsubscribes
# via the ESP but HubSpot's welcome workflow keeps emailing them.
#
# Repo secrets required once ESP is picked:
#   - ESP_API_KEY    (Settings → Secrets and variables → Actions)
#   - HUBSPOT_API_KEY (private app token, marketing email scope)
#
# Schedule chosen to spread load off the top of the hour. Free GitHub Actions
# cron can be delayed up to ~15 min on quiet repos — acceptable for an
# unsubscribe-propagation window.

on:
  # TODO(esp-pick): re-enable the hourly schedule once ESP is wired up. Until
  # then the script raises NotImplementedError, so the cron would just spam
  # failures. Manual dispatch only for now.
  # schedule:
  #   - cron: "17 * * * *"  # every hour at :17
  workflow_dispatch: {}    # manual trigger from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync unsubscribes
        env:
          ESP_API_KEY: ${{ secrets.ESP_API_KEY }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: python3 scripts/sync-esp-unsubscribes-to-hubspot.py --push
