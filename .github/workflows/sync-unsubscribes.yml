name: Sync Postmark unsubscribes → HubSpot

# Purpose: mirror Postmark broadcast-stream unsubscribes into HubSpot via the
# v1 subscriptions endpoint (global opt-out). Closes the CASL gap where a
# recipient unsubscribes via Postmark but HubSpot's welcome workflow keeps
# emailing them.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   - POSTMARK_SERVER_TOKEN  (server-level token; broadcast stream access)
#   - HUBSPOT_API_KEY        (private app token, marketing email scope)
#
# Cron at every 20 minutes. Free GitHub Actions cron can be delayed up to
# ~15 min on quiet repos, so worst-case lag is ~35 min — still tight enough
# that the suppression gap between Postmark and HubSpot is rarely user-visible.

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync unsubscribes
        env:
          POSTMARK_SERVER_TOKEN: ${{ secrets.POSTMARK_SERVER_TOKEN }}
          HUBSPOT_API_KEY: ${{ secrets.HUBSPOT_API_KEY }}
        run: python3 scripts/sync-postmark-unsubscribes-to-hubspot.py --push
