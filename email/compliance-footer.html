<!--
  Canonical CASL-compliant footer for Postmark broadcasts.

  Drop this snippet at the bottom of any broadcast/email body for the
  40hr Farmer or Orisha. It satisfies CASL + CAN-SPAM in one line:

    - Sender identification: "Orisha" + valid mailing address
    - Functional unsubscribe via Postmark's {{{ pm:unsubscribe }}} merge tag
      (resolves to a per-recipient hosted Postmark unsubscribe URL; only
      works on a broadcast message stream, not transactional).
    - Custom tracking domain learn.orisha.io configured at the Postmark
      server level; CTA links in the body get wrapped at send time.
    - The two links in this footer (orisha.io homepage + Unsubscribe)
      carry `data-pm-no-track` so Postmark skips link-wrapping on them.
      Reason: we only care about CTA clicks for conversion tracking;
      footer-link clicks are noise. Unsubscribes are tracked separately
      via the Suppressions list on the broadcast stream (Postmark adds
      anyone who clicks {{{ pm:unsubscribe }}} to that list automatically).

  Renders as a single grey line, ~11px, left-aligned, no border:

    Orisha, 1535 ch. Ste-Foy, Québec, QC G1S 2P1, Canada · orisha.io · Unsubscribe

  Source of truth for the address: this file. If Orisha moves offices, update
  here first, then audit other places (about pages, contracts, HubSpot footer).
-->
<div style="font-size:11px;color:#9ca3af;margin-top:32px;line-height:1.4;">
Orisha, 1535 ch. Ste-Foy, Qu&eacute;bec, QC G1S 2P1, Canada &middot; <a data-pm-no-track href="https://orisha.io" style="color:#9ca3af;text-decoration:underline;">orisha.io</a> &middot; <a data-pm-no-track href="{{{ pm:unsubscribe }}}" style="color:#9ca3af;text-decoration:underline;">Unsubscribe</a>
</div>
